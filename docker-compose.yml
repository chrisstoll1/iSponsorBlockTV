services:
  worker:
    build: .
    image: isponsorblocktv:local
    restart: unless-stopped
    user: "${PUID:-568}:${PGID:-568}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ./data:/app/data
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: isponsorblocktv-dashboard:local
    restart: unless-stopped
    user: "${PUID:-568}:${PGID:-568}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
    environment:
      DASHBOARD_USERNAME: "${DASHBOARD_USERNAME:-admin}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env}"
    volumes:
      - ./data:/app/data
